schema_version: "1.1"
name: chat-clause-answer
expected_outcome: |
  The answer is in the reply, with no file. It rewrites the clause in Blake's house style and explains the grammar behind each change: Neither party may assign (shall with a negative subject states an absence of duty; MSCD 3.324, house rule 8); Supplier shall indemnify (will doesn't impose a duty; MSCD 3.111); no article before the party names (house rule 11); 30 days in digits only (house rule 2); no later than 30 days after, not within ... of (MSCD 10.69); arising out of rather than arising out of or relating to, or a statement of what is meant (MSCD 13.41); this agreement in lowercase (MSCD 2.123); such as a pointing word (MSCD 13.816).
